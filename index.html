<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020617;color:#e2e8f0;font-family:Arial,sans-serif;font-size:14px}
:root{--cyan:#22d3ee;--slate:#1e293b;--dark:#0f172a;--border:#334155}
.app{display:flex;flex-direction:column;min-height:100vh}
/* Topbar */
.topbar{background:#0f172a;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.topbar h1{color:var(--cyan);font-size:1rem;font-weight:900;flex:1}
.topbar .date{color:#475569;font-size:.7rem}

.bnav{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1px solid var(--border);display:flex;z-index:100}
.bnav button{flex:1;padding:10px 4px 8px;background:none;border:none;color:#475569;font-size:.6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .15s}
.bnav button .ico{font-size:1.2rem}
.bnav button.active{color:var(--cyan)}
.bnav button.active .ico{filter:drop-shadow(0 0 4px #22d3ee)}
/* Content */
.page{display:none;padding:14px 14px 80px}
.page.active{display:block}
/* Cards */
.card{background:#1e293b;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.card-title{font-weight:700;font-size:.9rem;margin-bottom:4px}
.card-sub{color:#64748b;font-size:.75rem}
/* Badges */
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:700;margin:1px}
.b-green{background:rgba(6,78,59,.5);color:#6ee7b7;border:1px solid #047857}
.b-amber{background:rgba(120,53,15,.5);color:#fcd34d;border:1px solid #b45309}
.b-red{background:rgba(127,29,29,.5);color:#fca5a5;border:1px solid #b91c1c}
.b-blue{background:rgba(30,58,138,.5);color:#93c5fd;border:1px solid #1d4ed8}
.b-slate{background:rgba(51,65,85,.5);color:#cbd5e1;border:1px solid #475569}
.b-cyan{background:rgba(8,145,178,.2);color:#22d3ee;border:1px solid #0891b2}
/* Stats grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{border-radius:10px;padding:11px;border:1px solid}
.stat .val{font-size:1.3rem;font-weight:900}
.stat .lbl{font-size:.65rem;color:#94a3b8;margin-top:1px}
/* Buttons */
.btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:700;font-size:.8rem;font-family:Arial,sans-serif}
.btn-cyan{background:#0891b2;color:#fff}
.btn-green{background:#065f46;color:#6ee7b7;border:1px solid #047857}
.btn-red{background:rgba(127,29,29,.5);color:#fca5a5;border:1px solid #991b1b}
.btn-sm{padding:4px 9px;font-size:.7rem;border-radius:6px;border:none;cursor:pointer;font-weight:700;font-family:Arial,sans-serif}
.btn-edit{background:#334155;color:#fff}
.btn-del{background:rgba(127,29,29,.4);color:#fca5a5;border:none}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:12px}

.modal{background:#0f172a;border:1px solid var(--border);border-radius:14px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#0f172a;z-index:1}
.modal-head h3{font-size:.9rem;font-weight:700}
.modal-close{background:none;border:none;color:#64748b;font-size:1.4rem;cursor:pointer;line-height:1}
.modal-body{padding:14px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:.68rem;color:#94a3b8;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.fg input,.fg select,.fg textarea{width:100%;background:#1e293b;border:1px solid var(--border);color:#e2e8f0;border-radius:7px;padding:7px 10px;font-size:.82rem;outline:none;font-family:Arial,sans-serif}

.btn-save{width:100%;background:#0891b2;color:#fff;border:none;padding:10px;border-radius:8px;font-size:.88rem;font-weight:700;cursor:pointer;margin-top:6px}

table{width:100%;border-collapse:collapse;font-size:.75rem}
thead{background:#1e293b}
th{padding:8px 10px;color:#64748b;font-size:.65rem;text-transform:uppercase;text-align:left;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid rgba(51,65,85,.4);vertical-align:middle}

.warn-box{background:rgba(245,158,11,.07);border:1px solid rgba(180,83,9,.3);border-radius:7px;padding:7px 10px;font-size:.72rem;color:#fcd34d;margin-bottom:8px}

.rank-item{display:flex;align-items:center;gap:8px;background:rgba(2,6,23,.5);border-radius:7px;padding:8px 10px;margin-bottom:5px}
.rnum{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.8rem;flex-shrink:0}
.r1{background:#f59e0b;color:#000}.r2{background:#94a3b8;color:#000}.r3{background:#92400e;color:#fff}.rn{background:#1e293b;color:#94a3b8}

.toast.show{display:block}

.chip{padding:4px 10px;border-radius:6px;border:none;font-size:.7rem;font-weight:700;cursor:pointer;background:#1e293b;color:#94a3b8;font-family:Arial,sans-serif}
.chip.on{background:#0891b2;color:#fff}

.ttype{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.ttype button{padding:8px;border-radius:7px;border:2px solid var(--border);background:#1e293b;color:#94a3b8;font-size:.78rem;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;transition:all .15s}
.ttype button.on{border-color:#0891b2;background:rgba(8,145,178,.2);color:#22d3ee}

.hcf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.hcf{background:rgba(2,6,23,.5);border-radius:6px;padding:6px 8px}
.hcf .lbl{font-size:.62rem;color:#64748b;text-transform:uppercase}
.hcf .val{font-size:.78rem;font-weight:600;color:#e2e8f0}

.bar-row{margin-bottom:7px}
.bar-row .bar-label{display:flex;justify-content:space-between;margin-bottom:2px;font-size:.73rem}
.bar-bg{background:#1e293b;border-radius:3px;height:6px}
.bar-fill{border-radius:3px;height:6px;transition:width .3s}

.stk{display:flex;align-items:center;gap:4px;justify-content:center}
.stk button{width:22px;height:22px;background:#334155;border:none;color:#fff;border-radius:4px;cursor:pointer;font-size:.9rem}

.dk-chip{padding:4px 9px;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:.7rem;cursor:pointer;font-family:Arial,sans-serif;transition:all .15s}

#splash{position:fixed;inset:0;background:#020617;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash .sp-logo{font-size:4rem;animation:pulse 1.2s infinite}
#splash .sp-title{font-size:1.4rem;font-weight:900;color:#22d3ee;letter-spacing:.05em}
#splash .sp-sub{font-size:.75rem;color:#475569}
#splash .sp-bar{width:160px;height:3px;background:#1e293b;border-radius:3px;overflow:hidden;margin-top:8px}
#splash .sp-progress{height:100%;background:linear-gradient(90deg,#0891b2,#22d3ee);border-radius:3px;animation:load 1s ease forwards}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes load{from{width:0}to{width:100%}}

#install-banner{display:none;position:fixed;bottom:68px;left:8px;right:8px;background:#0f172a;border:1px solid #0891b2;border-radius:12px;padding:10px 14px;z-index:150;flex-direction:row;align-items:center;gap:10px;box-shadow:0 4px 24px rgba(0,0,0,.5)}

#install-banner .ib-text strong{color:#22d3ee;display:block;font-size:.82rem;margin-bottom:2px}

#cmms-confirm .cc-btns{display:flex;gap:8px}
#cmms-confirm .cc-btns button{flex:1;padding:9px;border-radius:8px;border:none;font-weight:700;font-size:.82rem;cursor:pointer;font-family:Arial,sans-serif}
.cc-ok{background:#b91c1c;color:#fff}
.cc-cancel{background:#334155;color:#e2e8f0}
/* Swipe hint on first open */
.swipe-hint{text-align:center;color:#334155;font-size:.65rem;padding:4px;letter-spacing:.05em}

// Kompresi sederhana: menghapus key yg bernilai null/kosong & menggunakan key pendek saat save
const KEY_MAP={caseId:"ci",tanggal:"tg",mesinId:"mi",merk:"mk",area:"ar",tipeKerja:"tk",jenisKerusakan:"jk",areaKerusakan:"ak",detailKerusakan:"dk",keterangan:"kt",teknisi:"te",timeStart:"ts",timeFinish:"tf",tanggalSelesai:"ts2",downtime:"dt",pmId:"pm",partNama:"pn",partSupplier:"ps",partTglOrder:"pto",partEta:"pe",partQty:"pq",status:"st"};
const KEY_RMAP=Object.fromEntries(Object.entries(KEY_MAP).map(([k,v])=>[v,k]));
function compressRec(rec){const r={};for(const k in rec){const v=rec[k];if(v===null||v===undefined||v===""||( Array.isArray(v)&&v.length===0))continue;const sk=KEY_MAP[k]||k;r[sk]=v;}return r;}
function decompressRec(rec){const r={};for(const k in rec){const v=rec[k];const lk=KEY_RMAP[k]||k;r[lk]=v;}return r;}
function compressArr(arr){return Array.isArray(arr)?arr.map(compressRec):arr;}
function decompressArr(arr){return Array.isArray(arr)?arr.map(decompressRec):arr;}
function ls(k,d){
  try{
    const v=localStorage.getItem("cmmsL_"+k);
    if(!v)return d;
    const parsed=JSON.parse(v);
    // History & PM pakai kompresi, lainnya tidak
    if(k==="history")return decompressArr(parsed);
    return parsed;
  }catch{return d;}
}
function ss(k,v){
  try{
    const toStore=k==="history"?compressArr(v):v;
    localStorage.setItem("cmmsL_"+k,JSON.stringify(toStore));
  }catch(e){
    // Storage penuh: coba hapus key lama lalu retry
    console.warn("localStorage full:",e);
  }
}

function today(){return new Date().toISOString().split("T")[0];}
function fmtMin(m){if(!m||m===0)return"-";const h=Math.floor(m/60),mn=m%60;return h>0?h+"j "+mn+"m":mn+"m";}
function calcDT(s,e,d,dEnd){if(!s||!e||!d)return 0;try{const a=new Date(d+"T"+s),b=new Date((dEnd&&dEnd>=d?dEnd:d)+"T"+e),df=(b-a)/60000;return df>0?Math.round(df):0;}catch{return 0;}}
function badge(s){const m={"OK":"b-green","Aktif":"b-green","Selesai":"b-green","REPAIR":"b-amber","Terlambat":"b-red","Proses":"b-blue","Mendatang":"b-slate","Jatuh Tempo":"b-amber","STOP":"b-red","Planned":"b-slate","Terjadwal":"b-blue","Progress":"b-blue","PREVENTIVE":"b-cyan","CORRECTIVE":"b-amber"};return"badge "+(m[s]||"b-slate");}

  });
  if(alerts.length){
    html+=`<div class="sec red" style="margin-top:10px">⚠️ PM Perlu Perhatian (${alerts.length})</div>`;
    alerts.forEach(p=>{
      const m=machines.find(x=>x.id===p.machineId);
      html+=`<div class="card" style="border-color:rgba(185,28,28,.4);margin-bottom:6px;padding:9px 12px">
        <div style="font-weight:700;font-size:.82rem">${p.aktivitas}</div>
        <div style="font-size:.7rem;color:#94a3b8">${m?m.id+" "+m.merk:""} · Due: ${p.nextDue}</div>
        ${mkBadge(p.status)}
      </div>`;
    });
  }
  if(history.length){
    html+=`<div class="sec" style="margin-top:10px">History Terbaru</div>`;
    [...history].sort((a,b)=>(b.caseId||"").localeCompare(a.caseId||"")).slice(0,4).forEach(h=>{
      const m=machines.find(x=>x.id===h.mesinId);
      html+=`<div class="card" style="margin-bottom:6px;padding:9px 12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">
          <div><div style="font-weight:700;font-size:.82rem">${h.mesinId} <span style="color:#64748b;font-weight:400">${m?m.merk:""}</span></div>
          <div style="font-size:.7rem;color:#64748b">${h.areaKerusakan||h.keterangan||"-"}</div>
          <div style="font-size:.65rem;color:#475569">📅${h.tanggal} ⏱${fmtMin(h.downtime)}</div></div>
          ${mkBadge(h.status||"Proses")}
        </div>
      </div>`;
    });
  }
  document.getElementById("pg-dashboard").innerHTML=`<div style="padding-bottom:80px">${html}</div>`;
}

// ═══ MESIN ════════════════════════════════════════════════════════════════
let mesinQ="",mesinArea="Semua",mesinType="Semua";
function renderMesin(){
  const areas=["Semua",...new Set(machines.map(m=>m.area))];
  const types=["Semua",...new Set(machines.map(m=>m.type))];
  const filtered=machines.filter(m=>{
    const mq=m.id.toLowerCase().includes(mesinQ.toLowerCase())||m.merk.toLowerCase().includes(mesinQ.toLowerCase());
    return mq&&(mesinArea==="Semua"||m.area===mesinArea)&&(mesinType==="Semua"||m.type===mesinType);
  });
  const sc=s=>s==="OK"?"#34d399":s==="REPAIR"?"#fbbf24":"#f87171";
  let html=`
  <div class="hrow">
    <div><div style="font-size:1.2rem;font-weight:900">Data <span style="color:#22d3ee">Mesin</span></div><div style="font-size:.75rem;color:#64748b">${machines.length} unit</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-green" onclick="exportMesin()">📊 Export</button>
      <button class="btn btn-cyan" onclick="openAddMesin()">+ Tambah</button>
    </div>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    <select onchange="mesinArea=this.value;renderMesin()" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:6px 9px;font-size:.78rem;outline:none">${areas.map(a=>`<option${a===mesinArea?" selected":""}>${a}</option>`).join("")}</select>
    <select onchange="mesinType=this.value;renderMesin()" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:6px 9px;font-size:.78rem;outline:none">${types.map(t=>`<option${t===mesinType?" selected":""}>${t}</option>`).join("")}</select>
  </div>
  <input class="search" placeholder="Cari kode/merk..." value="${mesinQ}" oninput="mesinQ=this.value;renderMesin()"/>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Kode</th><th>Jenis</th><th>Area</th><th>Merk</th><th>Status</th><th>Kskan</th><th>Aksi</th></tr></thead>
    <tbody>`;
  filtered.forEach(m=>{
    const mh=history.filter(h=>h.mesinId===m.id);
    html+=`<tr>
      <td><span style="color:#22d3ee;font-weight:700;font-size:.72rem">${m.id}</span></td>
      <td style="font-size:.72rem">${m.type}</td>
      <td><span class="badge b-slate">${m.area}</span></td>
      <td style="font-size:.75rem">${m.merk}</td>
      <td><span style="color:${sc(m.status)};font-weight:700;font-size:.73rem">●${m.status}</span></td>
      <td style="text-align:center;font-weight:700;color:${mh.length>2?"#f87171":"#94a3b8"}">${mh.length}x</td>
      <td><div style="display:flex;gap:3px">
        <button class="btn-sm btn-edit" onclick="openEditMesin('${m.id}')">Edit</button>
        <button class="btn-sm btn-del" onclick="delMesin('${m.id}')">✕</button>
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById("pg-mesin").innerHTML=html;
}
function openAddMesin(){
  editId=null;
  openModal("Tambah Mesin",`
    <div class="fg"><label>Kode Mesin *</label><input id="f-id" placeholder="cth: MB-24A"/></div>
    <div class="fg"><label>Jenis Mesin</label><select id="f-type">${opts(["BUBUT","MILLING","VERTICAL BORING","RADIAL DRILLING","CRANE","LAS MIG","LAS TIG","CUTTING TORCH"],"BUBUT")}</select></div>
    <div class="fg"><label>Area</label><select id="f-area">${opts(["2A","2B","2C","3A","3B","TRAINING"],"2A")}</select></div>
    <div class="fg"><label>Merk</label><input id="f-merk"/></div>
    <div class="fg"><label>Kapasitas</label><input id="f-kap"/></div>
    <div class="fg"><label>Status</label><select id="f-status">${opts(["OK","REPAIR","STOP"],"OK")}</select></div>
    <button class="btn-save" onclick="saveMesin()">💾 Simpan</button>`);
}
function openEditMesin(id){
  const m=machines.find(x=>x.id===id);if(!m)return;editId=id;
  openModal("Edit Mesin",`
    <div class="fg"><label>Kode Mesin</label><input id="f-id" value="${m.id}" readonly style="color:#64748b"/></div>
    <div class="fg"><label>Jenis Mesin</label><select id="f-type">${opts(["BUBUT","MILLING","VERTICAL BORING","RADIAL DRILLING","CRANE","LAS MIG","LAS TIG","CUTTING TORCH"],m.type)}</select></div>
    <div class="fg"><label>Area</label><select id="f-area">${opts(["2A","2B","2C","3A","3B","TRAINING"],m.area)}</select></div>
    <div class="fg"><label>Merk</label><input id="f-merk" value="${m.merk}"/></div>
    <div class="fg"><label>Kapasitas</label><input id="f-kap" value="${m.kap}"/></div>
    <div class="fg"><label>Status</label><select id="f-status">${opts(["OK","REPAIR","STOP"],m.status)}</select></div>
    <button class="btn-save" onclick="saveMesin()">💾 Simpan</button>`);
}
function saveMesin(){
  const id=document.getElementById("f-id").value.trim();
  if(!id){alert("Kode wajib diisi!");return;}
  const rec={id,type:document.getElementById("f-type").value,area:document.getElementById("f-area").value,merk:document.getElementById("f-merk").value,kap:document.getElementById("f-kap").value,status:document.getElementById("f-status").value};
  if(editId)machines=machines.map(m=>m.id===editId?rec:m);
  else machines=[...machines,rec];
  save("machines",machines);closeModal();renderMesin();
}
function delMesin(id){if(confirm("Hapus mesin "+id+"?")){machines=machines.filter(m=>m.id!==id);save("machines",machines);renderMesin();}}
function exportMesin(){
  const rows=[["KODE","JENIS","AREA","MERK","KAPASITAS","STATUS","JML KERUSAKAN"],...machines.map(m=>[m.id,m.type,m.area,m.merk,m.kap,m.status,history.filter(h=>h.mesinId===m.id).length])];
  dlCSV(rows,"Data_Mesin");
}

// ═══ HISTORY CARD ════════════════════════════════════════════════════════
let histQ="",histFM="Semua",histFS="Semua",histFT="Semua",histPage=0;
const HIST_PER_PAGE=50;
function renderHistory(){
  const filtered=history.filter(h=>{
    const mm=histFM==="Semua"||h.mesinId===histFM;
    const ms=histFS==="Semua"||h.status===histFS;
    const mt=histFT==="Semua"||h.tipeKerja===histFT;
    const mq=!histQ||(h.caseId||"").toLowerCase().includes(histQ.toLowerCase())||(h.mesinId||"").toLowerCase().includes(histQ.toLowerCase())||(h.keterangan||"").toLowerCase().includes(histQ.toLowerCase());
    return mm&&ms&&mt&&mq;
  });
  const sc=s=>s==="Selesai"?"#047857":s==="Proses"?"#1d4ed8":"#b45309";
  let html=`
  <div class="hrow">
    <div><div style="font-size:1.2rem;font-weight:900">History <span style="color:#22d3ee">Card</span></div><div style="font-size:.75rem;color:#64748b">${history.length} kasus</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-green" onclick="exportHistory()">📊 Export</button>
      <button class="btn btn-cyan" onclick="openAddHistory()">+ Tambah</button>
    </div>
  </div>
  <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
    <select onchange="histFM=this.value;histPage=0;renderHistory()" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:5px 8px;font-size:.75rem;outline:none;max-width:130px">
      <option value="Semua">Semua Mesin</option>${machines.map(m=>`<option value="${m.id}"${m.id===histFM?" selected":""}>${m.id}</option>`).join("")}
    </select>
    <select onchange="histFS=this.value;histPage=0;renderHistory()" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:5px 8px;font-size:.75rem;outline:none">
      ${opts(["Semua","Proses","Selesai","Pending"],histFS)}</select>
    <select onchange="histFT=this.value;histPage=0;renderHistory()" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:5px 8px;font-size:.75rem;outline:none">
      ${opts(["Semua","CORRECTIVE","PREVENTIVE"],histFT)}</select>
  </div>
  <input class="search" placeholder="Cari Case-ID/mesin/keterangan..." value="${histQ}" oninput="histQ=this.value;histPage=0;renderHistory()"/>`;
  if(!filtered.length)html+=`<div style="text-align:center;color:#475569;padding:30px;font-style:italic">Belum ada data history</div>`;
  const sorted=filtered.sort((a,b)=>(b.caseId||"").localeCompare(a.caseId||""));
  const totalPages=Math.max(1,Math.ceil(sorted.length/HIST_PER_PAGE));
  if(histPage>=totalPages)histPage=totalPages-1;
  const pageData=sorted.slice(histPage*HIST_PER_PAGE,(histPage+1)*HIST_PER_PAGE);

  // Info baris
  const from=sorted.length?histPage*HIST_PER_PAGE+1:0;
  const to=Math.min((histPage+1)*HIST_PER_PAGE,sorted.length);
  html+=`<div style="font-size:.7rem;color:#64748b;margin-bottom:8px">Menampilkan <strong style="color:#e2e8f0">${from}–${to}</strong> dari <strong style="color:#22d3ee">${sorted.length}</strong> kasus</div>`;

  pageData.forEach(h=>{
    const m=machines.find(x=>x.id===h.mesinId);
    const tColor=h.tipeKerja==="PREVENTIVE"?"#22d3ee":"#fcd34d";
    html+=`<div class="card" style="border-left:3px solid ${sc(h.status||"Proses")};margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;gap:6px;margin-bottom:7px">
        <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
          <span style="color:#22d3ee;font-size:.7rem;font-weight:700">${h.caseId}</span>
          <span style="font-weight:700">${h.mesinId}</span>
          <span style="color:#64748b;font-size:.72rem">${m?m.merk:""}</span>
          <span class="badge b-slate">${h.area||""}</span>
          <span class="badge" style="background:rgba(0,0,0,.3);color:${tColor};border:1px solid ${tColor}">${h.tipeKerja||""}</span>
          ${mkBadge(h.status||"Proses")}
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn-sm btn-edit" onclick="openEditHistory('${h.caseId}')">Edit</button>
          <button class="btn-sm btn-del" onclick="delHistory('${h.caseId}')">✕</button>
        </div>
      </div>
      <div class="hcf-grid">
        <div class="hcf"><div class="lbl">📅 Tanggal</div><div class="val">${h.tanggal||"-"}</div></div>
        <div class="hcf"><div class="lbl">👤 Teknisi</div><div class="val">${h.teknisi||"-"}</div></div>
        <div class="hcf"><div class="lbl">⚠️ Jenis Kerusakan</div><div class="val">${h.jenisKerusakan||"-"}</div></div>
        <div class="hcf"><div class="lbl">📍 Area Kerusakan</div><div class="val">${h.areaKerusakan||"-"}</div></div>
        <div class="hcf"><div class="lbl">🔩 Detail</div><div class="val" style="font-size:.72rem">${Array.isArray(h.detailKerusakan)?h.detailKerusakan.map(d=>d.replace(/ -.*$/,"")).join(", "):(h.detailKerusakan||"-").replace(/ -.*$/,"")}</div></div>
        <div class="hcf"><div class="lbl">⏱ Downtime</div><div class="val" style="color:#f87171">${fmtMin(h.downtime)}</div></div>
        <div class="hcf"><div class="lbl">🕐 Mulai → Selesai</div><div class="val">${h.tanggal||"-"} ${h.timeStart||"-"} → ${h.tanggalSelesai&&h.tanggalSelesai!==h.tanggal?`<span style="color:#22d3ee">${h.tanggalSelesai}</span> `:""}${h.timeFinish||"-"}</div></div>
      </div>
      ${h.keterangan?`<div style="background:rgba(2,6,23,.5);border-radius:6px;padding:6px 8px;font-size:.75rem;color:#cbd5e1;margin-top:4px">📝 ${h.keterangan}</div>`:""}
      ${h.status==="Pending"&&h.partNama?`<div style="background:rgba(245,158,11,.1);border:1px solid rgba(180,83,9,.35);border-radius:7px;padding:7px 10px;margin-top:6px;font-size:.72rem">
        <div style="color:#fbbf24;font-weight:700;margin-bottom:4px">📦 Menunggu Part</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
          <div><span style="color:#64748b">Part: </span><span style="color:#e2e8f0;font-weight:600">${h.partNama}</span></div>
          ${h.partQty?`<div><span style="color:#64748b">Qty: </span><span style="color:#e2e8f0">${h.partQty}</span></div>`:""}
          ${h.partSupplier?`<div><span style="color:#64748b">Supplier: </span><span style="color:#e2e8f0">${h.partSupplier}</span></div>`:""}
          ${h.partTglOrder?`<div><span style="color:#64748b">Order: </span><span style="color:#e2e8f0">${h.partTglOrder}</span></div>`:""}
        </div>
        ${h.partEta?`<div style="margin-top:5px">${etaLabel(h.partEta)}</div>`:""}
      </div>`:""}
    </div>`;
  });

  // Pagination controls
  if(totalPages>1){
    html+=`<div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 0 4px">
      <button class="btn btn-sm btn-edit" style="padding:6px 14px;font-size:.75rem" onclick="histPage=0;renderHistory()" ${histPage===0?"disabled style='opacity:.35;cursor:default'":""}>«</button>
      <button class="btn btn-sm btn-edit" style="padding:6px 14px;font-size:.75rem" onclick="histPage=Math.max(0,histPage-1);renderHistory()" ${histPage===0?"disabled style='opacity:.35;cursor:default'":""}>‹ Prev</button>
      <span style="font-size:.75rem;color:#94a3b8">Hal <strong style="color:#22d3ee">${histPage+1}</strong> / ${totalPages}</span>
      <button class="btn btn-sm btn-edit" style="padding:6px 14px;font-size:.75rem" onclick="histPage=Math.min(totalPages-1,histPage+1);renderHistory()" ${histPage===totalPages-1?"disabled style='opacity:.35;cursor:default'":""}>Next ›</button>
      <button class="btn btn-sm btn-edit" style="padding:6px 14px;font-size:.75rem" onclick="histPage=totalPages-1;renderHistory()" ${histPage===totalPages-1?"disabled style='opacity:.35;cursor:default'":""}>»</button>
    </div>`;
  }

  document.getElementById("pg-history").innerHTML=html;
}

function nextCaseId(){
  const nums=history.map(h=>{const n=parseInt((h.caseId||"").replace(/\D/g,""));return isNaN(n)?0:n;});
  return "CASE-"+String(Math.max(0,...nums)+1).padStart(4,"0");
}

function openAddHistory(){editId=null;buildHistoryForm({caseId:nextCaseId(),tanggal:today(),tipeKerja:"CORRECTIVE",status:"Proses"});}
function openEditHistory(id){const h=history.find(x=>x.caseId===id);if(!h)return;editId=id;buildHistoryForm(h);}

function buildHistoryForm(h){

      <select id="h-jenisKerusakan" onchange="onJenisChangeH()">

    <div class="fg" id="fg-pm" style="${h.tipeKerja==="PREVENTIVE"?"":"display:none"}"><label>Hubungkan ke Jadwal PM (opsional)</label>

function toggleDKChip(btn,val){
  btn.classList.toggle("sel");
  const hidden=document.getElementById("h-detailKerusakan");
  const current=hidden.value?hidden.value.split("||").filter(Boolean):[];
  if(btn.classList.contains("sel")){if(!current.includes(val))current.push(val);}
  else{const i=current.indexOf(val);if(i>-1)current.splice(i,1);}
  hidden.value=current.join("||");
}
function markPartDatang(){

  const sel=document.getElementById("h-status");

function etaLabel(eta){
  if(!eta)return"";
  const diff=Math.round((new Date(eta)-new Date(today()))/(1000*60*60*24));
  if(diff<0)return`<span style="color:#f87171">⚠️ Sudah lewat ${Math.abs(diff)} hari dari estimasi!</span>`;
  if(diff===0)return`<span style="color:#fbbf24">🟡 Estimasi tiba HARI INI</span>`;
  return`<span style="color:#6ee7b7">🕐 Estimasi tiba ${diff} hari lagi (${eta})</span>`;
}

function calcDTForm(){
  const s=document.getElementById("h-timeStart").value;
  const e=document.getElementById("h-timeFinish").value;
  const d=document.getElementById("h-tanggal").value;
  const dEnd=document.getElementById("h-tanggalSelesai")?document.getElementById("h-tanggalSelesai").value:"";
  // Auto-validate: tanggalSelesai tidak boleh sebelum tanggal mulai
  if(dEnd&&dEnd<d){document.getElementById("h-tanggalSelesai").style.borderColor="#f87171";document.getElementById("dt-display").innerHTML="⚠️ Tanggal selesai tidak boleh sebelum tanggal mulai!";document.getElementById("dt-display").style.display="";return;}
  if(document.getElementById("h-tanggalSelesai"))document.getElementById("h-tanggalSelesai").style.borderColor=dEnd&&dEnd!==d?"#22d3ee":"";
  const dt=calcDT(s,e,d,dEnd||d);
  document.getElementById("h-downtime").value=dt;
  const disp=document.getElementById("dt-display");
  if(dt>0){
    const days=dEnd&&dEnd!==d?` (${Math.floor(dt/60/24)} hari ${Math.floor((dt%1440)/60)}j ${dt%60}m)`:"";
    disp.innerHTML=`⏱ Downtime: <strong>${fmtMin(dt)}</strong>${days}`;disp.style.display="";}
  else disp.style.display="none";
}
function saveHistory(){
  const mesinId=document.getElementById("h-mesinId").value;
  const tanggal=document.getElementById("h-tanggal").value;
  if(!mesinId||!tanggal){alert("Mesin & Tanggal wajib!");return;}
  const status=document.getElementById("h-status").value;
  const rec={
    caseId:editId||nextCaseId(),tanggal,mesinId,
    merk:(machines.find(x=>x.id===mesinId)||{}).merk||"",
    area:(machines.find(x=>x.id===mesinId)||{}).area||"",
    tipeKerja:document.getElementById("h-tipeKerja").value,
    jenisKerusakan:document.getElementById("h-jenisKerusakan").value,
    areaKerusakan:document.getElementById("h-areaKerusakan").value,
    detailKerusakan:(()=>{const v=document.getElementById("h-detailKerusakan")?document.getElementById("h-detailKerusakan").value:"";return v?v.split("||").filter(Boolean):[];})(),
    keterangan:document.getElementById("h-keterangan").value,
    teknisi:document.getElementById("h-teknisi").value,
    timeStart:document.getElementById("h-timeStart").value,
    timeFinish:document.getElementById("h-timeFinish").value,
    tanggalSelesai:document.getElementById("h-tanggalSelesai")?document.getElementById("h-tanggalSelesai").value:"",
    downtime:parseInt(document.getElementById("h-downtime").value)||0,
    pmId:document.getElementById("h-pmId")?document.getElementById("h-pmId").value:"",
    partNama:document.getElementById("h-partNama")?document.getElementById("h-partNama").value:"",
    partSupplier:document.getElementById("h-partSupplier")?document.getElementById("h-partSupplier").value:"",
    partTglOrder:document.getElementById("h-partTglOrder")?document.getElementById("h-partTglOrder").value:"",
    partEta:document.getElementById("h-partEta")?document.getElementById("h-partEta").value:"",
    partQty:document.getElementById("h-partQty")?document.getElementById("h-partQty").value:"",
    status
  };
  if(status==="Proses"||status==="Pending")machines=machines.map(m=>m.id===mesinId?{...m,status:"REPAIR"}:m);
  else if(status==="Selesai"){
    const others=history.filter(h=>h.mesinId===mesinId&&h.caseId!==rec.caseId&&(h.status==="Proses"||h.status==="Pending"));
    if(!others.length)machines=machines.map(m=>m.id===mesinId?{...m,status:"OK"}:m);
  }
  save("machines",machines);
  if(editId)history=history.map(h=>h.caseId===editId?rec:h);
  else history=[...history,rec];
  save("history",history);closeModal();renderHistory();
}
function delHistory(id){
  if(!confirm("Hapus?"))return;
  const h=history.find(x=>x.caseId===id);
  history=history.filter(x=>x.caseId!==id);
  if(h){const rem=history.filter(x=>x.mesinId===h.mesinId&&(x.status==="Proses"||x.status==="Pending"));if(!rem.length)machines=machines.map(m=>m.id===h.mesinId?{...m,status:"OK"}:m);}
  save("machines",machines);save("history",history);renderHistory();
}

// Hitung nextDue berdasarkan lastDone + frekuensi
function calcNextDue(lastDone, frekuensi){
  if(!lastDone)return"";
  const d=new Date(lastDone);
  const f={"Harian":1,"Mingguan":7,"Bulanan":30,"3 Bulanan":90,"6 Bulanan":180,"Tahunan":365};
  d.setDate(d.getDate()+(f[frekuensi]||30));
  return d.toISOString().split("T")[0];
}

// Hitung status PM otomatis berdasarkan nextDue
function calcPMStatus(nextDue){
  if(!nextDue)return"Mendatang";
  const diff=Math.round((new Date(nextDue)-new Date(today()))/(1000*60*60*24));
  if(diff<0)return"Terlambat";
  if(diff<=7)return"Jatuh Tempo";
  return"Mendatang";
}

// Update semua status PM setiap render
function refreshPMStatus(){
  let changed=false;
  preventive=preventive.map(p=>{
    const ns=calcPMStatus(p.nextDue);
    if(ns!==p.status){changed=true;return{...p,status:ns};}
    return p;
  });
  if(changed)ss("pm",preventive);
}

        <div style="display:flex;align-items:flex-start;gap:8px">

              <div style="display:flex;justify-content:space-between;font-size:.65rem;color:#64748b;margin-bottom:3px"><span>Checklist Progress</span><span style="color:${pct===100?"#6ee7b7":"#94a3b8"}">${done}/${total} (${pct}%)</span></div>
              <div class="bar-bg"><div class="bar-fill" style="background:${pct===100?"#059669":"#0891b2"};width:${pct}%"></div></div>
            </div>`:""}
            ${p.catatan?`<div style="font-size:.7rem;color:#94a3b8;margin-top:4px;font-style:italic">📝 ${p.catatan}</div>`:""}
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
            <button class="btn-sm" style="background:#065f46;color:#6ee7b7;border:none;font-size:.68rem" onclick="openChecklistPM('${p.id}')">✓ Checklist</button>

            <button class="btn-sm btn-del" style="font-size:.68rem" onclick="delPM('${p.id}')">✕</button>

  document.getElementById("pg-preventive").innerHTML=html;
}

function openAddPMBulk(){
  const mesinOpts=`<option value="">-- Pilih Mesin --</option>${mOpts("")}`;
  openModal("📋 Tambah PM dari Template",`
    <div class="fg"><label>Pilih Mesin *</label>
      <select id="bulk-mesin" onchange="loadPMTemplate()">${mesinOpts}</select>
    </div>
    <div class="fg"><label>Teknisi PIC</label><input id="bulk-tek" placeholder="Nama teknisi"/></div>
    <div class="fg"><label>Tanggal Mulai</label><input type="date" id="bulk-start" value="${today()}"/></div>
    <div id="bulk-template-area" style="margin-top:8px">
      <div style="color:#475569;font-size:.78rem;font-style:italic">Pilih mesin dulu untuk melihat template checklist</div>
    </div>
    <button class="btn-save" style="margin-top:10px" onclick="savePMBulk()">💾 Simpan Semua yang Dipilih</button>`);
}

function loadPMTemplate(){
  const mesinId=document.getElementById("bulk-mesin").value;
  if(!mesinId){document.getElementById("bulk-template-area").innerHTML='<div style="color:#475569;font-size:.78rem">Pilih mesin dulu</div>';return;}
  const m=machines.find(x=>x.id===mesinId);
  const tpl=PM_TEMPLATE[m?m.type:"DEFAULT"]||PM_TEMPLATE["DEFAULT"];
  const colors={"Harian":"#22d3ee","Mingguan":"#6ee7b7","Bulanan":"#fbbf24","3 Bulanan":"#f87171","6 Bulanan":"#d8b4fe","Tahunan":"#fb923c"};
  let html=`<div style="font-size:.72rem;color:#64748b;margin-bottom:8px">Pilih aktivitas yang akan dijadwalkan:</div>`;
  tpl.forEach((grp,gi)=>{
    html+=`<div style="margin-bottom:10px">
      <div style="font-size:.72rem;font-weight:700;color:${colors[grp.kat]||"#94a3b8"};margin-bottom:5px;text-transform:uppercase">${grp.kat}</div>`;
    grp.items.forEach((item,ii)=>{
      const key=`bulk-${gi}-${ii}`;
      // Cek apakah sudah ada PM ini untuk mesin ini
      const exists=preventive.some(p=>p.machineId===mesinId&&p.aktivitas===item);
      html+=`<label style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:rgba(2,6,23,.4);margin-bottom:3px;cursor:${exists?"default":"pointer"};opacity:${exists?".45":"1"}">
        <input type="checkbox" id="${key}" value="${item}" data-frek="${grp.kat}" ${exists?"disabled checked":""} style="accent-color:#0891b2">
        <span style="font-size:.75rem;flex:1">${item}</span>
        ${exists?'<span style="font-size:.6rem;color:#22d3ee">✓ Ada</span>':''}
      </label>`;
    });
    html+="</div>";
  });
  document.getElementById("bulk-template-area").innerHTML=html;
}

function savePMBulk(){
  const mesinId=document.getElementById("bulk-mesin").value;
  const tek=document.getElementById("bulk-tek").value;
  const start=document.getElementById("bulk-start").value||today();
  if(!mesinId){alert("Pilih mesin dulu!");return;}
  const checkboxes=document.querySelectorAll('#bulk-template-area input[type=checkbox]:checked:not(:disabled)');
  if(!checkboxes.length){alert("Pilih minimal 1 aktivitas!");return;}
  let added=0;
  checkboxes.forEach(cb=>{
    const frek=cb.dataset.frek;
    const nextId="PM"+String(Date.now()+added).slice(-6);
    const rec={id:nextId,machineId:mesinId,aktivitas:cb.value,frekuensi:frek,lastDone:"",nextDue:calcNextDue(start,frek),teknisi:tek,status:"Mendatang",checklist:[],catatan:""};
    preventive=[...preventive,rec];
    added++;
  });
  ss("pm",preventive);closeModal();renderPreventive();
  showToastMsg(`✅ ${added} jadwal PM berhasil ditambahkan`);
}

    <div class="fg"><label>ID</label><input value="${p.id}" readonly style="color:#64748b"/></div>
    <div class="fg"><label>Mesin</label><select id="pm-mesin">${mOpts(p.machineId)}</select></div>

function savePM(id){
  const isEdit=id&&preventive.some(p=>p.id===id);
  const nextId=id||(  "PM"+String(Date.now()).slice(-6));
  const rec={
    id:nextId,
    machineId:document.getElementById("pm-mesin").value,
    aktivitas:document.getElementById("pm-akt").value,
    frekuensi:document.getElementById("pm-frek").value,
    lastDone:document.getElementById("pm-last").value,
    nextDue:document.getElementById("pm-next").value||calcNextDue(document.getElementById("pm-last").value,document.getElementById("pm-frek").value),
    teknisi:document.getElementById("pm-tek").value,
    catatan:document.getElementById("pm-cat")?document.getElementById("pm-cat").value:"",
    status:calcPMStatus(document.getElementById("pm-next").value),
    checklist:isEdit?(preventive.find(p=>p.id===id).checklist||[]):[]
  };
  if(isEdit)preventive=preventive.map(p=>p.id===id?rec:p);
  else preventive=[...preventive,rec];
  ss("pm",preventive);closeModal();renderPreventive();
}

// ─── CHECKLIST MODAL ──────────────────────────────────────────────────────
function openChecklistPM(id){
  const p=preventive.find(x=>x.id===id);if(!p)return;
  const m=machines.find(x=>x.id===p.machineId);
  const mtype=m?m.type:"DEFAULT";
  // Gunakan checklist tersimpan, atau generate dari template
  let checklist=p.checklist&&p.checklist.length?[...p.checklist]:[];
  if(!checklist.length){
    // Cari item aktivitas ini di template
    const tpl=PM_TEMPLATE[mtype]||PM_TEMPLATE["DEFAULT"];
    for(const grp of tpl){
      if(grp.items.includes(p.aktivitas)||p.aktivitas.toLowerCase().includes(grp.kat.toLowerCase())){
        checklist=grp.items.map(i=>({text:i,done:false}));break;
      }
    }
    // Jika tidak ketemu template, buat 1 item dari aktivitas itu sendiri
    if(!checklist.length)checklist=[{text:p.aktivitas,done:false}];
  }
  const done=checklist.filter(c=>c.done).length;
  const total=checklist.length;
  openModal(`✅ Checklist PM — ${p.aktivitas}`,`
    <div style="font-size:.72rem;color:#64748b;margin-bottom:10px">
      ${m?`⚙️ ${m.id} · ${m.type} · ${m.area}`:""}  · 🔄 ${p.frekuensi} · 📅 Due: <span style="color:#22d3ee">${p.nextDue||"-"}</span>
    </div>
    <div style="background:rgba(8,145,178,.08);border-radius:8px;padding:8px 10px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:4px"><span style="color:#94a3b8">Progress</span><span id="cl-count" style="color:#22d3ee;font-weight:700">${done}/${total}</span></div>
      <div class="bar-bg"><div class="bar-fill" id="cl-bar" style="background:#0891b2;width:${total?Math.round(done/total*100):0}%"></div></div>
    </div>
    <div id="cl-list">
      ${checklist.map((c,i)=>`
        <label style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;background:rgba(2,6,23,.5);margin-bottom:4px;cursor:pointer;border:1px solid ${c.done?"rgba(5,150,105,.4)":"rgba(51,65,85,.5)"}">
          <input type="checkbox" ${c.done?"checked":""} onchange="toggleCLItem(this,${i},'${id}')" style="accent-color:#059669;width:16px;height:16px;flex-shrink:0">
          <span style="font-size:.78rem;${c.done?"text-decoration:line-through;color:#475569":"color:#e2e8f0"}">${c.text}</span>
        </label>`).join("")}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
      <button class="btn" style="background:#334155;color:#e2e8f0;padding:9px;font-size:.8rem" onclick="checkAllCL('${id}',true)">☑ Centang Semua</button>
      <button class="btn" style="background:#334155;color:#e2e8f0;padding:9px;font-size:.8rem" onclick="checkAllCL('${id}',false)">☐ Reset</button>
    </div>
    <button class="btn-save" style="margin-top:8px;background:#059669" onclick="completePM('${id}')">✅ Selesai & Perbarui Jadwal</button>`);
  // Simpan checklist sementara ke state
  _clState={id,checklist};
}

let _clState={id:null,checklist:[]};
function toggleCLItem(cb,idx,pmId){
  if(_clState.id!==pmId)return;
  _clState.checklist[idx].done=cb.checked;
  // Update bar
  const done=_clState.checklist.filter(c=>c.done).length;
  const total=_clState.checklist.length;
  const pct=total?Math.round(done/total*100):0;
  const bar=document.getElementById("cl-bar");
  const cnt=document.getElementById("cl-count");
  if(bar)bar.style.width=pct+"%";
  if(cnt)cnt.textContent=done+"/"+total;
  // Warna label
  const label=cb.closest("label");
  if(label){
    label.style.borderColor=cb.checked?"rgba(5,150,105,.4)":"rgba(51,65,85,.5)";
    const span=label.querySelector("span");
    if(span){span.style.textDecoration=cb.checked?"line-through":"";span.style.color=cb.checked?"#475569":"#e2e8f0";}
  }
}
function checkAllCL(pmId,val){
  if(_clState.id!==pmId)return;
  _clState.checklist=_clState.checklist.map(c=>({...c,done:val}));
  openChecklistPM(pmId);// re-render
}
function completePM(id){
  const done=_clState.checklist.filter(c=>c.done).length;
  const total=_clState.checklist.length;
  if(done<total){
    const p=preventive.find(x=>x.id===id);
    const pct=Math.round(done/total*100);
    if(!confirm(`Baru ${done}/${total} item selesai (${pct}%). Tandai selesai tetap?`))return;
  }
  preventive=preventive.map(p=>{
    if(p.id!==id)return p;
    const nextDue=calcNextDue(today(),p.frekuensi);
    return{...p,lastDone:today(),nextDue,status:calcPMStatus(nextDue),checklist:_clState.checklist.map(c=>({...c,done:false}))};
  });
  ss("pm",preventive);closeModal();renderPreventive();
  showToastMsg("✅ PM selesai! Jadwal berikutnya diperbarui.");
}

function markPMDone(id){completePM(id);}
function delPM(id){
  cmmsConfirm("Hapus Jadwal PM","Jadwal PM ini akan dihapus permanen.","Hapus").then(ok=>{
    if(!ok)return;
    preventive=preventive.filter(p=>p.id!==id);
    ss("pm",preventive);renderPreventive();
  });
}
function exportPM(){
  dlCSV([
    ["ID","MESIN","TIPE MESIN","AREA","AKTIVITAS","FREKUENSI","TERAKHIR DONE","JADWAL BERIKUTNYA","TEKNISI","STATUS","CATATAN"],
    ...preventive.map(p=>{const m=machines.find(x=>x.id===p.machineId);return[p.id,p.machineId,m?m.type:"",m?m.area:"",p.aktivitas,p.frekuensi,p.lastDone||"-",p.nextDue||"-",p.teknisi||"-",p.status,p.catatan||""];})
  ],"Jadwal_PM");
}
function showToastMsg(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>{t.classList.remove("show");t.textContent="✅ Tersimpan";},2500);}

// ═══ SPAREPART ════════════════════════════════════════════════════════════
let spQ="",spFilt="Semua";
function renderSparepart(){
  const kats=["Semua","Kritis",...new Set(spareparts.map(s=>s.kategori))];
  const filtered=spareparts.filter(s=>{
    const mq=s.nama.toLowerCase().includes(spQ.toLowerCase())||s.kode.toLowerCase().includes(spQ.toLowerCase());
    const mf=spFilt==="Semua"?true:spFilt==="Kritis"?s.stok<=s.minStok:s.kategori===spFilt;
    return mq&&mf;
  });
  const totalNilai=spareparts.reduce((a,s)=>a+s.stok*s.harga,0);
  let html=`
  <div class="hrow">
    <div><div style="font-size:1.2rem;font-weight:900">Stock <span style="color:#22d3ee">Sparepart</span></div></div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-green" onclick="exportSP()">📊 Export</button>
      <button class="btn btn-cyan" onclick="openAddSP()">+ Tambah</button>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px">
    <div class="card" style="padding:9px;text-align:center"><div style="font-weight:900;font-size:1.1rem">${spareparts.length}</div><div style="font-size:.65rem;color:#64748b">Total Item</div></div>
    <div class="card" style="padding:9px;text-align:center;border-color:rgba(185,28,28,.4)"><div style="font-weight:900;font-size:1.1rem;color:#f87171">${spareparts.filter(s=>s.stok<=s.minStok).length}</div><div style="font-size:.65rem;color:#64748b">Kritis</div></div>
    <div class="card" style="padding:9px;text-align:center"><div style="font-weight:700;font-size:.78rem">Rp${(totalNilai/1e6).toFixed(1)}jt</div><div style="font-size:.65rem;color:#64748b">Nilai Total</div></div>
  </div>
  <div class="chips">${kats.map(k=>`<button class="chip${spFilt===k?" on":""}" onclick="spFilt='${k}';renderSparepart()">${k==="Kritis"?"🔴 ":""}${k}</button>`).join("")}</div>
  <input class="search" placeholder="Cari nama/kode..." value="${spQ}" oninput="spQ=this.value;renderSparepart()"/>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Kode</th><th>Nama</th><th>Stok</th><th>Min</th><th>Aksi</th></tr></thead>
    <tbody>`;
  filtered.forEach(s=>{
    const k=s.stok<=s.minStok;
    html+=`<tr${k?' style="background:rgba(127,29,29,.08)"':""}>
      <td style="color:#22d3ee;font-size:.7rem;font-weight:700">${s.kode}</td>
      <td><div style="font-weight:700;font-size:.75rem">${s.nama}</div><div style="font-size:.65rem;color:#64748b">${s.kategori}·${s.satuan}</div></td>
      <td style="text-align:center">
        <div class="stk">
          <button onclick="adjSP('${s.id}',-1)">−</button>
          <span style="font-weight:700;min-width:22px;text-align:center;color:${k?"#f87171":"#fff"}">${s.stok}</span>
          <button onclick="adjSP('${s.id}',1)">+</button>
        </div>${k?`<div style="font-size:.6rem;color:#f87171">⚠Kritis</div>`:""}
      </td>
      <td style="text-align:center;color:#94a3b8">${s.minStok}</td>
      <td><div style="display:flex;gap:3px">
        <button class="btn-sm btn-edit" onclick="openEditSP('${s.id}')">Edit</button>
        <button class="btn-sm btn-del" onclick="delSP('${s.id}')">✕</button>
      </div></td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  document.getElementById("pg-sparepart").innerHTML=html;
}

function openEditSP(id){const s=spareparts.find(x=>x.id===id);if(!s)return;editId=id;buildSPForm(s);}
function buildSPForm(s){
  openModal((editId?"Edit":"Tambah")+" Sparepart",`
    <div class="fg"><label>Kode Part</label><input id="s-kode" value="${s.kode||""}"/></div>
    <div class="fg"><label>Nama Part</label><input id="s-nama" value="${s.nama||""}"/></div>
    <div class="fg"><label>Kategori</label><select id="s-kat">${opts(["Bearing","Belt","Filter","Pelumas","Seal","Electrical","Sensor","Lainnya"],s.kategori||"Bearing")}</select></div>

function saveSP(id){
  const rec={id:editId||id,kode:document.getElementById("s-kode").value,nama:document.getElementById("s-nama").value,kategori:document.getElementById("s-kat").value,satuan:document.getElementById("s-sat").value,stok:+document.getElementById("s-stok").value,minStok:+document.getElementById("s-min").value,harga:+document.getElementById("s-harga").value,lokasi:document.getElementById("s-lok").value,supplier:document.getElementById("s-sup").value};
  if(editId)spareparts=spareparts.map(s=>s.id===editId?rec:s);
  else spareparts=[...spareparts,rec];
  save("sp",spareparts);closeModal();renderSparepart();
}
function adjSP(id,d){spareparts=spareparts.map(s=>s.id===id?{...s,stok:Math.max(0,s.stok+d)}:s);save("sp",spareparts);renderSparepart();}
function delSP(id){if(confirm("Hapus?")){{spareparts=spareparts.filter(s=>s.id!==id);save("sp",spareparts);renderSparepart();}}}
function exportSP(){dlCSV([["ID","KODE","NAMA","KATEGORI","SATUAN","STOK","MIN STOK","HARGA","NILAI TOTAL","LOKASI","SUPPLIER"],...spareparts.map(s=>[s.id,s.kode,s.nama,s.kategori,s.satuan,s.stok,s.minStok,s.harga,s.stok*s.harga,s.lokasi,s.supplier])],"Stock_Sparepart");}

// ═══ AUDIT ════════════════════════════════════════════════════════════════
let auditPeriod="Semua";
let _auditCache={period:null,histLen:0,html:null}; // lazy cache

function renderAudit(){
  const periods=["Semua",...[...new Set(history.map(h=>h.tanggal?.slice(0,7)))].sort().reverse()];
  // Lazy: skip kalkulasi jika periode & data tidak berubah
  if(_auditCache.period===auditPeriod && _auditCache.histLen===history.length && _auditCache.html){
    // Cukup update selector periode saja
    document.getElementById("pg-audit").innerHTML=_auditCache.html;
    return;
  }
  const filtered=auditPeriod==="Semua"?history:history.filter(h=>(h.tanggal||"").startsWith(auditPeriod));
  const totalKasus=filtered.length;
  const corrective=filtered.filter(h=>h.tipeKerja==="CORRECTIVE").length;
  const preventif=filtered.filter(h=>h.tipeKerja==="PREVENTIVE").length;
  const totalDT=filtered.reduce((a,h)=>a+(h.downtime||0),0);
  const selesai=filtered.filter(h=>h.status==="Selesai").length;
  const pmDone=preventive.filter(p=>p.status==="Mendatang").length;
  const pmComp=preventive.length?Math.round(pmDone/preventive.length*100):0;

  // Rankings
  const rankMachine=()=>{const map={};filtered.filter(h=>h.tipeKerja==="CORRECTIVE").forEach(h=>{map[h.mesinId]=(map[h.mesinId]||0)+1;});return Object.entries(map).map(([id,c])=>{const m=machines.find(x=>x.id===id);return{id,c,type:m?.type||"-",merk:m?.merk||"-"};}).sort((a,b)=>b.c-a.c)};
  const rankDT=()=>{const map={};filtered.forEach(h=>{map[h.mesinId]=(map[h.mesinId]||0)+(h.downtime||0);});return Object.entries(map).map(([id,dt])=>{const m=machines.find(x=>x.id===id);return{id,dt,type:m?.type||"-",merk:m?.merk||"-"};}).sort((a,b)=>b.dt-a.dt).slice(0,8);};
  const rankArea=()=>{const map={};filtered.forEach(h=>{const k=h.areaKerusakan||"Tdk Tercatat";map[k]=(map[k]||0)+1;});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);};
  const rankDetail=()=>{const map={};filtered.forEach(h=>{const items=Array.isArray(h.detailKerusakan)?h.detailKerusakan:[h.detailKerusakan||""];items.filter(Boolean).forEach(d=>{const k=d.replace(/ -.*$/,"")||"Tdk Tercatat";map[k]=(map[k]||0)+1;});});return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);};
  const rankJenis=()=>{const map={};filtered.forEach(h=>{const k=h.jenisKerusakan||"Tdk Tercatat";map[k]=(map[k]||0)+1;});return Object.entries(map).sort((a,b)=>b[1]-a[1]);};

  const rcl=i=>i===0?"r1":i===1?"r2":i===2?"r3":"rn";
  const rankByType=["BUBUT","MILLING","CRANE","LAS MIG","LAS TIG","VERTICAL BORING","RADIAL DRILLING","CUTTING TORCH"].map(t=>{
    const list=machines.filter(m=>m.type===t);
    const ranked=list.map(m=>{const c=filtered.filter(h=>h.mesinId===m.id&&h.tipeKerja==="CORRECTIVE").length;const dt=filtered.filter(h=>h.mesinId===m.id).reduce((a,h)=>a+(h.downtime||0),0);return{id:m.id,merk:m.merk,c,dt};}).filter(x=>x.c>0).sort((a,b)=>b.c-a.c).slice(0,3);
    return{type:t,ranked};
  }).filter(x=>x.ranked.length>0);

  let html=`
  <div class="hrow">
    <div><div style="font-size:1.2rem;font-weight:900">Laporan <span style="color:#22d3ee">Audit</span></div><div style="font-size:.75rem;color:#64748b">Analisis lengkap</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <select onchange="_auditCache.html=null;auditPeriod=this.value;renderAudit()" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:7px;padding:6px 9px;font-size:.78rem;outline:none">
        ${periods.map(p=>`<option${p===auditPeriod?" selected":""}>${p}</option>`).join("")}
      </select>
      <button class="btn btn-green" onclick="exportAudit()">📊 Export Full</button>
    </div>
  </div>
  <div style="background:rgba(8,145,178,.07);border:1px solid rgba(8,145,178,.2);border-radius:11px;padding:11px;margin-bottom:12px">
    <div class="sec cyan">📋 Ringkasan — ${auditPeriod}</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">
      ${[["Total Kasus",totalKasus,"#22d3ee"],["Corrective",corrective,"#f87171"],["Preventive",preventif,"#86efac"],["Total Downtime",fmtMin(totalDT),"#fbbf24"],["Selesai",selesai,"#34d399"],["PM Compliance",pmComp+"%",pmComp>=80?"#34d399":"#f87171"]].map(([l,v,c])=>`<div style="background:rgba(2,6,23,.5);border-radius:7px;padding:8px;text-align:center"><div style="font-weight:900;font-size:1rem;color:${c}">${v}</div><div style="font-size:.62rem;color:#64748b">${l}</div></div>`).join("")}
    </div>
  </div>`;

  if(!totalKasus){html+=`<div class="card" style="text-align:center;color:#475569;font-style:italic;padding:24px">Belum ada data. Tambahkan History Card dulu.</div>`;document.getElementById("pg-audit").innerHTML=html;return;}

  html+=`<div class="sec cyan">🏆 Ranking Mesin Sering Rusak per Tipe</div>`;
  if(!rankByType.length)html+=`<div style="color:#475569;font-size:.78rem;margin-bottom:10px;font-style:italic">Belum ada data kerusakan corrective</div>`;
  rankByType.forEach(({type,ranked})=>{
    html+=`<div class="card" style="margin-bottom:8px"><div style="font-weight:700;color:#22d3ee;font-size:.8rem;margin-bottom:7px">⚙️ ${type}</div>`;
    ranked.forEach((m,i)=>{html+=`<div class="rank-item"><div class="${rcl(i)} rnum">${i+1}</div><div style="flex:1"><div style="font-weight:700;font-size:.78rem">${m.id}</div><div style="font-size:.65rem;color:#64748b">${m.merk}</div></div><div style="text-align:right"><div style="color:#f87171;font-weight:700;font-size:.78rem">${m.c}x rusak</div><div style="font-size:.63rem;color:#fbbf24">${fmtMin(m.dt)}</div></div></div>`;});
    html+=`</div>`;
  });

  html+=`<div class="sec red">⏱ Top Downtime Terlama</div><div class="card" style="margin-bottom:12px">`;
  rankDT().forEach((x,i)=>{html+=`<div class="rank-item"><div class="${rcl(i)} rnum">${i+1}</div><div style="flex:1"><div style="font-weight:700;font-size:.78rem">${x.id} <span style="color:#64748b;font-weight:400">${x.merk}</span></div><div style="font-size:.65rem;color:#64748b">${x.type}</div></div><div style="font-weight:700;color:#fbbf24">${fmtMin(x.dt)}</div></div>`;});
  html+=`</div>`;

  html+=`<div class="sec amber">📍 Ranking Area Kerusakan</div><div class="card" style="margin-bottom:12px">`;
  rankArea().forEach(([k,v],i)=>{html+=`<div class="rank-item"><div class="${rcl(i)} rnum">${i+1}</div><div style="flex:1;font-size:.76rem;font-weight:600">${k}</div><div style="font-weight:700;color:#fbbf24">${v}x</div></div>`;});
  html+=`</div>`;

  html+=`<div class="sec amber">🔩 Ranking Komponen/Part Rusak</div><div class="card" style="margin-bottom:12px">`;
  rankDetail().forEach(([k,v],i)=>{html+=`<div class="rank-item"><div class="${rcl(i)} rnum">${i+1}</div><div style="flex:1;font-size:.76rem;font-weight:600">${k}</div><div style="font-weight:700;color:#fbbf24">${v}x</div></div>`;});
  html+=`</div>`;

  html+=`<div class="sec">⚠️ Distribusi Jenis Kerusakan</div><div class="card">`;
  const jk=rankJenis();
  const colMap={MEKANIK:"#fbbf24",ELEKTRIK:"#93c5fd",HIDROLIK:"#6ee7b7",PNEUMATIK:"#d8b4fe",LAINNYA:"#94a3b8"};
  jk.forEach(([k,v])=>{const pct=totalKasus?Math.round(v/totalKasus*100):0;const c=colMap[k]||"#94a3b8";html+=`<div class="bar-row"><div class="bar-label"><span>${k}</span><span style="color:${c};font-weight:700">${v}x (${pct}%)</span></div><div class="bar-bg"><div class="bar-fill" style="background:${c};width:${pct}%"></div></div></div>`;});
  html+=`</div>`;
  _auditCache={period:auditPeriod,histLen:history.length,html};
  document.getElementById("pg-audit").innerHTML=html;
}

function exportAudit(){
  const filtered=auditPeriod==="Semua"?history:history.filter(h=>(h.tanggal||"").startsWith(auditPeriod));
  const totalDT=filtered.reduce((a,h)=>a+(h.downtime||0),0);
  const rows=[
    ["=== LAPORAN AUDIT MAINTENANCE ==="],[""],
    ["PERIODE",auditPeriod],["TANGGAL CETAK",new Date().toLocaleDateString("id-ID")],[""],
    ["TOTAL KASUS",filtered.length],["CORRECTIVE",filtered.filter(h=>h.tipeKerja==="CORRECTIVE").length],
    ["PREVENTIVE",filtered.filter(h=>h.tipeKerja==="PREVENTIVE").length],
    ["TOTAL DOWNTIME",fmtMin(totalDT)],["SELESAI",filtered.filter(h=>h.status==="Selesai").length],[""],
    ["=== DETAIL HISTORY ==="],
    ["CASE-ID","TGL MULAI","TGL SELESAI","MESIN","TIPE","JENIS KERUSAKAN","AREA KERUSAKAN","DETAIL","DOWNTIME","TEKNISI","STATUS"],
    ...filtered.map(h=>[h.caseId,h.tanggal,h.tanggalSelesai||h.tanggal,h.mesinId,h.tipeKerja,h.jenisKerusakan,h.areaKerusakan,Array.isArray(h.detailKerusakan)?h.detailKerusakan.map(d=>d.replace(/ -.*$/,"")).join("; "):(h.detailKerusakan||"").replace(/ -.*$/,""),fmtMin(h.downtime),h.teknisi,h.status])
  ];
  dlCSV(rows,"Laporan_Audit_"+auditPeriod);
}

// ═══ UTILS ════════════════════════════════════════════════════════════════
function dlCSV(rows,fname){
  const csv=rows.map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname+".csv";a.click();
}


function backupCMMS(){
  const data={};
  Object.keys(localStorage).forEach(k=>{ if(k.startsWith('cmmsL_')) data[k]=localStorage.getItem(k); });
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='CMMS_Backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function restoreCMMS(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      Object.keys(data).forEach(k=>localStorage.setItem(k,data[k]));
      alert('Restore berhasil. Aplikasi dimuat ulang.');
      location.reload();
    }catch(err){ alert('File backup tidak valid');}
  };
  reader.readAsText(file);
}
function resetCMMS(){
  cmmsConfirm('🗑 Reset Semua Data','Seluruh data History, PM, Sparepart, dan Mesin akan dihapus permanen. Pastikan sudah backup!','Hapus Semua').then(ok=>{
    if(!ok)return;
    cmmsConfirm('⚠️ Konfirmasi Terakhir','Yakin ingin menghapus semua data?','Ya, Hapus').then(ok2=>{
      if(!ok2)return;
      Object.keys(localStorage).forEach(k=>{ if(k.startsWith('cmmsL_')) localStorage.removeItem(k); });
      location.reload();
    });
  });
}

    <div style="display:flex;align-items:center;gap:12px">

      </div>

  </div>
  <div class="card" style="background:rgba(8,145,178,.06);border-color:rgba(34,211,238,.2)">
    <div class="card-title" style="color:#22d3ee">💾 Info Storage</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div style="background:rgba(2,6,23,.5);border-radius:7px;padding:8px;text-align:center"><div style="font-weight:900;font-size:1rem;color:#22d3ee">${usedKB} KB</div><div style="font-size:.65rem;color:#64748b">Digunakan</div></div>

      <div style="background:rgba(2,6,23,.5);border-radius:7px;padding:8px;text-align:center"><div style="font-weight:900;font-size:1rem;color:#fbbf24">${history.length}</div><div style="font-size:.65rem;color:#64748b">Total History</div></div>
      <div style="background:rgba(2,6,23,.5);border-radius:7px;padding:8px;text-align:center"><div style="font-weight:900;font-size:1rem;color:#d8b4fe">${machines.length}</div><div style="font-size:.65rem;color:#64748b">Total Mesin</div></div>

    <button class="btn btn-green" style="width:100%;padding:10px;font-size:.85rem" onclick="backupCMMS()">📥 Backup Data (JSON)</button>
    <button class="btn btn-cyan" style="width:100%;padding:10px;font-size:.85rem" onclick="document.getElementById('restoreFile').click()">📤 Restore dari Backup</button>
    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreCMMS(event)">
  </div>
  ${_deferredInstall?`<div class="card" style="border-color:rgba(34,211,238,.3)"><button class="btn btn-cyan" style="width:100%;padding:10px;font-size:.85rem" onclick="doInstall()">📲 Pasang sebagai App</button></div>`:''}
  <div class="sec red">⚠️ Danger Zone</div>
  <div class="card">
    <button class="btn btn-red" style="width:100%;padding:10px;font-size:.85rem" onclick="resetCMMS()">🗑 Reset Semua Data</button>
  </div>
  <div class="card">
    <div style="font-weight:700;font-size:.88rem;margin-bottom:6px">Tentang Aplikasi</div>

      <div>✅ Dashboard real-time</div>
      <div>✅ Manajemen 90+ mesin</div>
      <div>✅ History Card + Pagination 50/hal</div>
      <div>✅ Multi-pilih Detail Kerusakan</div>
      <div>✅ Preventive Maintenance tracker</div>
      <div>✅ Stok Sparepart + alert kritis</div>
      <div>✅ Laporan Audit + Export CSV</div>
      <div>✅ Kompresi data localStorage</div>
      <div>✅ 100% Offline — tidak perlu internet</div>
    </div>

}

// ═══ CUSTOM CONFIRM ═══════════════════════════════════════════════════════
let _ccResolve=null;
function cmmsConfirm(title,msg,okLabel='OK'){
  return new Promise(resolve=>{
    _ccResolve=resolve;
    document.getElementById('cc-title').textContent=title;
    document.getElementById('cc-msg').textContent=msg;
    document.getElementById('cc-ok-btn').textContent=okLabel;
    document.getElementById('cmms-confirm').classList.add('open');
  });
}
function ccResolve(val){
  document.getElementById('cmms-confirm').classList.remove('open');
  if(_ccResolve){_ccResolve(val);_ccResolve=null;}
}

// ═══ PWA / INSTALL ════════════════════════════════════════════════════════
let _deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  _deferredInstall=e;
  if(!localStorage.getItem('cmmsInstallDismissed')){
    document.getElementById('install-banner').classList.add('show');
  }
});
function doInstall(){
  if(!_deferredInstall)return;
  _deferredInstall.prompt();
  _deferredInstall.userChoice.then(()=>{_deferredInstall=null;dismissInstall();});
}
function dismissInstall(){
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('cmmsInstallDismissed','1');
}

// ═══ OFFLINE DETECTION ════════════════════════════════════════════════════
function updateOnlineStatus(){
  const badge=document.getElementById('offlineBadge');
  if(badge)badge.style.display=navigator.onLine?'none':'inline';
}
window.addEventListener('online',updateOnlineStatus);
window.addEventListener('offline',updateOnlineStatus);

// ═══ SERVICE WORKER (inline) ══════════════════════════════════════════════
if('serviceWorker' in navigator){
  const swCode=`
const CACHE='cmms-v2';
const ASSETS=[location.href||'/'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));});
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res&&res.status===200){const c=res.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));}return res;}).catch(()=>caches.match(e.request))));});
`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ═══ INIT ════════════════════════════════════════════════════════════════
document.getElementById("topDate").textContent=new Date().toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
updateOnlineStatus();
